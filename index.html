<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebGIS Jaringan Jalan</title>

  <!-- Favicon Dummy untuk Mencegah Error 404 Favicon -->
  <link rel="shortcut icon" href="#" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    .legend {
      background: white;
      padding: 10px;
      line-height: 1.8em;
      border-radius: 5px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      font-size: 12px;
    }
    .legend i {
      width: 18px;
      height: 4px;
      float: left;
      margin-right: 8px;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([-7.237, 109.112], 13);

    // Basemap OSM
    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Basemap Satelit (Esri)
    const esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles © Esri'
    });

    // Warna berdasarkan atribut "kondisi_jalan"
    function getColor(kondisi) {
      switch (kondisi) {
        case 'Baik': return '#2ecc71';          // Hijau
        case 'Sebagian Rusak': return '#f39c12';// Oranye
        case 'Rusak': return '#e74c3c';         // Merah
        default: return '#3498db';              // Biru
      }
    }

    // Dynamic Style
    function style(feature) {
      // Menyesuaikan dengan atribut "kondisi_jalan" dari GeoJSON
      const kondisi = feature.properties.kondisi_jalan || feature.properties.kondisi;
      return {
        color: getColor(kondisi),
        weight: 4,
        opacity: 0.85
      };
    }

// Pop-up Info
    function onEachFeature(feature, layer) {
      if (feature.properties) {
        const p = feature.properties;
        
        // Handling fallback jika ada perbedaan penamaan atribut
        const idRuas = p.id || p.id_ruas || '-';
        const ruas = p.ruas_jalan || p.ruas || '-';
        const status = p.status_jalan || p.status || '-';
        const kondisi = p.kondisi_jalan || p.kondisi || '-';
        const perkerasan = p.jenis_perkerasan || p.perkerasan || '-';
        const panjang = p.panjang_jalan || p.panjang_m || 0;

        const content = `
          <div style="font-size:13px;">
            <b>ID Ruas:</b> ${idRuas}<br>
            <b>Ruas:</b> ${ruas}<br>
            <b>Status:</b> ${status}<br>
            <b>Kondisi:</b> <b>${kondisi}</b><br>
            <b>Panjang:</b> ${typeof panjang === 'number' ? panjang.toFixed(2) : panjang} m<br>
            <b>Perkerasan:</b> ${perkerasan}<br>
            <small><i>${p.sumber || ''}</i></small>
          </div>
        `;
        layer.bindPopup(content);
      }
    }

    // Fetch GeoJSON menggunakan Relative Path ./
    fetch('./jalan.geojson')
      .then(res => {
        if (!res.ok) {
          throw new Error(`HTTP error! Status: ${res.status}`);
        }
        return res.json();
      })
      .then(data => {
        const jalanLayer = L.geoJSON(data, {
          style: style,
          onEachFeature: onEachFeature
        }).addTo(map);

        // Otomatis zoom ke area fitur jalan
        map.fitBounds(jalanLayer.getBounds());
      })
      .catch(err => console.error('Gagal memuat GeoJSON:', err));

    // Control Layer & Legend
    const baseMaps = { "OpenStreetMap": osm, "Satelit Esri": esriSat };
    L.control.layers(baseMaps).addTo(map);

    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = function () {
      const div = L.DomUtil.create('div', 'legend');
      div.innerHTML = `
        <b>Kondisi Jalan</b><br>
        <i style="background: #2ecc71"></i> Baik<br>
        <i style="background: #f39c12"></i> Sebagian Rusak<br>
        <i style="background: #e74c3c"></i> Rusak<br>
      `;
      return div;
    };
    legend.addTo(map);
  </script>
</body>
</html>
