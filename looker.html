
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Looker Preview - Jaringan Jalan</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; }
    .compact-legend {
      background: rgba(255, 255, 255, 0.9);
      padding: 6px 10px;
      font-size: 11px;
      border-radius: 4px;
      font-family: sans-serif;
    }
    .dot {
      height: 8px; width: 8px;
      display: inline-block;
      border-radius: 50%;
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: false }).setView([-7.237, 109.112], 13);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: ''
    }).addTo(map);

    function getColor(kondisi) {
      return kondisi === 'Baik' ? '#2ecc71' :
             kondisi === 'Sebagian Rusak' ? '#f39c12' : '#e74c3c';
    }

    fetch('Jalan.geojson')
      .then(res => res.json())
      .then(data => {
        const layer = L.geoJSON(data, {
          style: f => ({ color: getColor(f.properties.kondisi), weight: 3 }),
          onEachFeature: (f, l) => {
            l.bindPopup(`<b>${f.properties.ruas}</b><br>Kondisi: ${f.properties.kondisi}`);
          }
        }).addTo(map);
        map.fitBounds(layer.getBounds(), { padding: [10, 10] });
      });
  </script>
</body>
</html>
